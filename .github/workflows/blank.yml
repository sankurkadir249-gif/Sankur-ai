name: Build SANKUR AI Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platformunu uret
        run: flutter create --platforms=android --project-name sankur_ai_ultra --org com.sankur .

      - name: Android ayarlarini yap
        run: python3 tool/patch_android.py

      - name: Paketleri indir
        run: flutter pub get

      - name: Ornek testi sil
        run: rm -f test/widget_test.dart

      - name: arm64 release APK derle
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: SANKUR-AI-ULTRA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
