name: Build SANKUR AI Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  # Projedeki paketler (sqflite, syncfusion_flutter_pdf...) Flutter 3.38+ istiyor.
  # 3.47.9 = su an en yeni stable. Daha eski bir surume DUSURME, "pub get" hata verir.
  FLUTTER_VERSION: "3.47.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projeyi bul ve köke al
        run: |
          if [ ! -f pubspec.yaml ]; then
            for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _zip; done || true
          fi
          if [ ! -f pubspec.yaml ]; then
            P=$(find . -name pubspec.yaml -not -path "./.git/*" -not -path "*/.dart_tool/*" | head -n1)
            [ -z "$P" ] && { echo "pubspec.yaml bulunamadi"; exit 1; }
            cp -r "$(dirname "$P")"/. .
          fi
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Android platformunu uret
        run: flutter create --platforms=android --project-name sankur_ai_ultra --org com.sankur .

      - name: Android ayarlarini yap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("android")
          manifest = android / "app/src/main/AndroidManifest.xml"
          t = manifest.read_text(encoding="utf-8")
          for p in ("INTERNET", "RECORD_AUDIO"):
              tag = f'<uses-permission android:name="android.permission.{p}"/>'
              if tag not in t:
                  t = t.replace("<application", tag + "\n    <application", 1)
          tts = '<intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>'
          if tts not in t:
              if "<queries>" in t:
                  t = t.replace("<queries>", "<queries>" + tts, 1)
              else:
                  t = t.replace("<application", "<queries>" + tts + "</queries>\n    <application", 1)
          manifest.write_text(t, encoding="utf-8")
          for name in ("build.gradle.kts", "build.gradle"):
              f = android / "app" / name
              if f.exists():
                  v = f.read_text(encoding="utf-8")
                  v = v.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
                  v = v.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 26")
                  v = v.replace("ndkVersion = flutter.ndkVersion", 'ndkVersion = "28.2.13676358"')
                  v = v.replace("ndkVersion flutter.ndkVersion", 'ndkVersion "28.2.13676358"')
                  f.write_text(v, encoding="utf-8")
          # Gradle "Already watching path" hatasi icin dosya izlemeyi kapat
          gp = android / "gradle.properties"
          g = gp.read_text(encoding="utf-8") if gp.exists() else ""
          if "org.gradle.vfs.watch" not in g:
              g = g.rstrip("\n") + "\norg.gradle.vfs.watch=false\n"
          gp.write_text(g, encoding="utf-8")
          d = android / "app/src/main/kotlin/com/sankur/sankur_ai_ultra"
          d.mkdir(parents=True, exist_ok=True)
          (d / "MainActivity.kt").write_text('''package com.sankur.sankur_ai_ultra

          import android.app.ActivityManager
          import android.content.Context
          import android.os.StatFs
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "sankur/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "getMetrics") {
                              try {
                                  val m = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                                  val mi = ActivityManager.MemoryInfo()
                                  m.getMemoryInfo(mi)
                                  val s = StatFs(filesDir.absolutePath)
                                  result.success(mapOf(
                                      "totalRamBytes" to mi.totalMem,
                                      "availableRamBytes" to mi.availMem,
                                      "freeStorageBytes" to s.availableBytes
                                  ))
                              } catch (e: Exception) {
                                  result.error("DEVICE_METRICS", e.message, null)
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          ''', encoding="utf-8")
          PY

      - name: Eksik asset klasorlerini olustur
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          lines = Path("pubspec.yaml").read_text(encoding="utf-8").splitlines()
          in_assets = False
          base = 0
          for line in lines:
              if not in_assets:
                  if re.match(r"^\s*assets:\s*(#.*)?$", line):
                      in_assets = True
                      base = len(line) - len(line.lstrip())
                  continue
              if not line.strip() or line.strip().startswith("#"):
                  continue
              m = re.match(r"^\s*-\s+(.+?)\s*(#.*)?$", line)
              if m and len(line) - len(line.lstrip()) >= base:
                  path = m.group(1).strip().strip("'\"")
                  if ":" in path:
                      continue
                  if path.endswith("/"):
                      Path(path).mkdir(parents=True, exist_ok=True)
                  elif not Path(path).exists():
                      print(f"::warning::pubspec'te yazili asset bulunamadi: {path}")
              else:
                  in_assets = False
          PY

      - name: Paketleri indir
        run: flutter pub get

      - name: Ornek testi sil
        run: rm -f test/widget_test.dart

      - name: Otomatik duzeltme (dart fix)
        continue-on-error: true
        run: |
          dart fix --apply 2>&1 | tee fix.log || true
          {
            echo '## dart fix (sadece CI icinde uygulanir)'
            echo '```'
            tail -n 40 fix.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Analiz (hatalari goster)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          errs=$(grep -E " error " analyze.log | head -40 || true)
          {
            echo '## Analiz hatalari'
            if [ -n "$errs" ]; then
              echo '```'
              echo "$errs"
              echo '```'
            else
              echo 'Analizde hata yok.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # YENI ADIM: model_storage.dart 93. satir (File -> Future<String> hatasi)
      # dart fix'ten SONRA calisir ki satir numarasi derleyicinin gordugu dosyayla ayni olsun.
      - name: model_storage.dart 93. satir duzeltmesi
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("lib/services/model_storage.dart")
          lines = p.read_text(encoding="utf-8").split("\n")
          i = 92  # 93. satir
          cur = lines[i] if len(lines) > i else ""
          m = re.match(r"^(\s*return\s+)(.+?)(\s*;\s*)$", cur)
          if not m or m.group(2).endswith(".path"):
              print(f"::warning::93. satir beklenen formatta degil, degistirilmedi: {cur.strip()}")
          else:
              expr = m.group(2)
              if not re.fullmatch(r"[\w.]+", expr):
                  expr = f"({expr})"
              lines[i] = f"{m.group(1)}{expr}.path{m.group(3)}"
              p.write_text("\n".join(lines), encoding="utf-8")
              print("Duzeltildi:", lines[i].strip())
          PY

      - name: arm64 release APK derle
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Ilk Dart hatalari calisma sayfasinin en ustunde kirmizi kutuda gorunur
            derrs=$(grep -E "\.dart:[0-9]+:[0-9]+: Error" build.log | awk '!s[$0]++' | head -10)
            if [ -n "$derrs" ]; then
              echo "$derrs" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=Dart hatasi::$l"; done
            else
              msg=$(sed -n '1,/^FAILURE: Build failed/p' build.log | tail -n 15 | tr '\n' ' ' | sed 's/%/%25/g')
              echo "::error title=Derleme hatasi::$msg"
            fi
            {
              echo '## Derleme hatalari (FAILURE satirinin ustundeki son 40 satir)'
              echo '```'
              sed -n '1,/^FAILURE: Build failed/p' build.log | tail -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: SANKUR-AI-ULTRA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
